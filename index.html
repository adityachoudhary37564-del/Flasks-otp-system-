
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowUp | Account</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f2f7f3;
  font-family:Arial,sans-serif;
}
.container{
  width:100%;
  max-width:390px;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 35px #00000012;
}
.logo{
  color:#16834b;
  font-size:27px;
  font-weight:bold;
  margin-bottom:25px;
}
h2{margin:0 0 8px;color:#202820}
p{color:#777;font-size:14px}
input{
  width:100%;
  padding:15px;
  margin-top:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none;
}
input:focus{border-color:#16834b}
button{
  width:100%;
  padding:15px;
  margin-top:17px;
  border:0;
  border-radius:10px;
  background:#16834b;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.6}
.switch{
  text-align:center;
  margin-top:20px;
  font-size:14px;
}
.switch a{
  color:#16834b;
  font-weight:bold;
  cursor:pointer;
}
.hidden{display:none}
#message{
  margin-top:15px;
  font-size:14px;
  text-align:center;
}
</style>
</head>

<body>
<div class="container">

  <div class="logo">GrowUp.</div>

  <!-- LOGIN -->
  <section id="login">
    <h2>Welcome back</h2>
    <p>Login to continue to your account.</p>

    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="Email address" required>
      <input id="loginPassword" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="switch">
      Don't have an account?
      <a onclick="showPage('signup')">Sign up</a>
    </div>
  </section>

  <!-- SIGNUP -->
  <section id="signup" class="hidden">
    <h2>Create account</h2>
    <p>Enter your details to get started.</p>

    <form id="signupForm">
      <input id="signupEmail" type="email" placeholder="Email address" required>
      <input id="signupPassword" type="password" placeholder="Create password (8+ characters)" minlength="8" required>
      <button type="submit">Send OTP</button>
    </form>

    <div class="switch">
      Already have an account?
      <a onclick="showPage('login')">Login</a>
    </div>
  </section>

  <!-- OTP -->
  <section id="verify" class="hidden">
    <h2>Verify email</h2>
    <p>Enter the OTP sent to your email.</p>

    <form id="verifyForm">
      <input id="otp" type="text" inputmode="numeric"
       maxlength="6" placeholder="Enter 6-digit OTP" required>
      <button type="submit">Verify OTP</button>
    </form>
  </section>

  <!-- ACCOUNT -->
  <section id="dashboard" class="hidden">
    <h2>You're logged in!</h2>
    <p id="userEmail"></p>
    <button onclick="logout()">Logout</button>
  </section>

  <div id="message"></div>
</div>

<script>
const API = "https://flasks-otp-system.onrender.com";

let signupEmail = "";
let signupPassword = "";

function showPage(page){
  ["login","signup","verify","dashboard"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById(page).classList.remove("hidden");
  document.getElementById("message").textContent = "";
}

function showMessage(message, success=false){
  const el = document.getElementById("message");
  el.textContent = message;
  el.style.color = success ? "#16834b" : "#d33";
}

async function api(path, data){
  const response = await fetch(API + path,{
    method:"POST",
    credentials:"include",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
  });

  const result = await response.json();
  if(!response.ok) throw new Error(result.message || "Request failed");
  return result;
}

// LOGIN
document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();

  try{
    const result = await api("/login",{
      email:document.getElementById("loginEmail").value,
      password:document.getElementById("loginPassword").value
    });

    document.getElementById("userEmail").textContent=result.email;
    showPage("dashboard");
  }catch(error){
    showMessage(error.message);
  }
});

// SIGNUP OTP REQUEST
document.getElementById("signupForm").addEventListener("submit",async e=>{
  e.preventDefault();

  signupEmail=document.getElementById("signupEmail").value;
  signupPassword=document.getElementById("signupPassword").value;

  try{
    const result=await api("/signup/request",{
      email:signupEmail,
      password:signupPassword
    });

    showPage("verify");
    showMessage(result.message,true);
  }catch(error){
    showMessage(error.message);
  }
});

// VERIFY OTP
document.getElementById("verifyForm").addEventListener("submit",async e=>{
  e.preventDefault();

  try{
    const result=await api("/signup/verify",{
      email:signupEmail,
      otp:document.getElementById("otp").value
    });

    document.getElementById("userEmail").textContent=signupEmail;
    showPage("dashboard");
  }catch(error){
    showMessage(error.message);
  }
});

// LOGOUT
async function logout(){
  try{
    await api("/logout",{});
    showPage("login");
  }catch(error){
    showMessage(error.message);
  }
}

// CHECK EXISTING SESSION
async function checkSession(){
  try{
    const response=await fetch(API+"/me",{credentials:"include"});
    if(response.ok){
      const data=await response.json();
      document.getElementById("userEmail").textContent=data.email;
      showPage("dashboard");
    }
  }catch(error){}
}

checkSession();
</script>
</body>
</html>
